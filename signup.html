<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Computer Shop</title>
    <style>
        .box {
            border: 2px solid black;
            padding: 30px;
            width: 300px;
            margin: 50px auto;
            font-family: Arial, sans-serif;
        }
        .box h2 {
            text-align: center;
            margin-top: 0;
        }
        .field {
            margin-bottom: 15px;
        }
        .box input, .box select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        .box button {
            width: 100%;
            padding: 10px;
            background-color: #28a745; /* Green button for sign up */
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        .box button:hover {
            background-color: #218838;
        }
        .login-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            text-decoration: none;
            color: #007bff;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Create Account</h2>

        <div class="field">
            <label for="role">Sign up as:</label>
            <select id="role">
                <option value="customer">Customer</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <div class="field">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" placeholder="Enter full name">
        </div>

        <div class="field">
            <label for="email">Email Address:</label>
            <input type="email" id="email" placeholder="Enter email">
        </div>

        <div class="field">
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" placeholder="Enter phone number">
        </div>

        <div class="field">
            <label for="password">Create Password:</label>
            <input type="password" id="password" placeholder="Create a password">
        </div>

        <!-- Temporary simple alert for testing -->
        <button type="button" onclick="alert('Account Created Successfully!')">Sign Up</button>
        
        <!-- Link to jump back to your login page -->
        <a href="adminlogin.html" class="login-link">Already have an account? Log In</a>
    </div>

</body>
</html>
